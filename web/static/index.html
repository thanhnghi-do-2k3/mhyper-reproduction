<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-Hyper Research Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#ecf2ff;background:#10141d}body{margin:0}nav{display:flex;gap:8px;padding:16px 24px;border-bottom:1px solid #2a3445}nav strong{margin-right:auto;color:#83d7c3}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#171e2b;border:1px solid #29364a;border-radius:10px;padding:16px}.metric{font-size:28px;color:#83d7c3}button,input,select{background:#182231;color:inherit;border:1px solid #34435a;border-radius:6px;padding:9px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #29364a}th,.muted{color:#9cadc8}.pill{padding:3px 7px;border-radius:20px;background:#294b4a;font-size:12px}.error{color:#ff9b9b}pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#0e131c;padding:12px;border-radius:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style></head>
<body>
<nav><strong>M-Hyper Research Lab</strong><button data-page="overview">Overview</button><button data-page="runs">Runs Library</button><button data-page="compare">Compare</button><button data-page="new">New Experiment</button><button data-page="datasets">Datasets & Environment</button></nav>
<main id="app"><p>Loading…</p></main>
<script>
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,options);if(!r.ok)throw new Error(await r.text());return r.json()}
const badge=v=>`<span class="pill">${esc(v)}</span>`;
function table(rows){if(!rows.length)return '<div class="card">No runs yet. Use New Experiment or the CPU smoke command.</div>';return `<table><thead><tr><th>Run</th><th>Dataset</th><th>Variant</th><th>Status</th><th>Seed</th><th>Best valid MRR</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#run/${esc(r.run_id)}">${esc(r.run_id)}</a><br><span class="muted">${esc(r.name)}</span></td><td>${esc(r.dataset_name)}</td><td>${esc(r.variant)}</td><td>${badge(r.status)}</td><td>${r.seed}</td><td>${r.best_validation_mrr??'Not Recorded'}</td></tr>`).join('')}</tbody></table>`}
async function overview(){try{const x=await api('/api/overview');app.innerHTML=`<h1>Overview</h1><div class="grid"><div class="card"><div class="muted">Total runs</div><div class="metric">${x.total_runs}</div></div>${Object.entries(x.counts).map(([k,v])=>`<div class="card"><div class="muted">${esc(k)}</div><div class="metric">${v}</div></div>`).join('')}</div><h2>Recent runs</h2>${table(x.recent)}`}catch(e){app.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function runs(){app.innerHTML='<h1>Runs Library</h1><div class="row"><input id="q" placeholder="Search run, variant, error"><select id="s"><option value="">All statuses</option><option>QUEUED</option><option>RUNNING</option><option>COMPLETED</option><option>FAILED</option><option>BLOCKED</option></select><button id="search">Search</button></div><div id="results">Loading…</div>';const load=async()=>{const p=new URLSearchParams({query:q.value,status:s.value});results.innerHTML=table(await api('/api/runs?'+p))};search.onclick=load;await load()}
async function detail(id){try{const r=await api('/api/runs/'+encodeURIComponent(id));app.innerHTML=`<button onclick="location.hash='#runs'">← Runs</button><h1>${esc(r.name)} ${badge(r.status)}</h1><div class="grid"><div class="card"><div class="muted">Identity</div>${esc(r.run_id)}<br>Dataset: ${esc(r.dataset_name)}<br>Variant: ${esc(r.variant)}<br>Seed: ${r.seed}</div><div class="card"><div class="muted">Provenance</div>${badge(r.provenance_status)}<br>Validation: ${esc(r.validation_integrity)}<br>Reproduction: ${esc(r.reproduction_assessment)}</div><div class="card"><div class="muted">Selection</div>Best epoch: ${r.best_epoch??'Not Recorded'}<br>Valid MRR: ${r.best_validation_mrr??'Not Recorded'}</div></div><h2>Metrics</h2><table><tr><th>Epoch</th><th>Split</th><th>Total loss</th><th>Fit</th><th>Regularizer</th><th>Duration</th></tr>${r.epochs.map(m=>`<tr><td>${m.epoch}</td><td>${m.split}</td><td>${m.total_loss??'Not Recorded'}</td><td>${m.fit_loss??'Not Recorded'}</td><td>${m.regularizer_loss??'Not Recorded'}</td><td>${m.duration_seconds??'Not Recorded'}</td></tr>`).join('')}</table><h2>Evaluation</h2><table><tr><th>Split</th><th>Checkpoint</th><th>Direction</th><th>MRR</th><th>Hits@1/3/10</th><th>N</th></tr>${r.evaluations.map(m=>`<tr><td>${m.split}</td><td>${m.checkpoint_kind}</td><td>${m.direction}</td><td>${m.mrr.toFixed(4)}</td><td>${m.hits_at_1.toFixed(3)} / ${m.hits_at_3.toFixed(3)} / ${m.hits_at_10.toFixed(3)}</td><td>${m.sample_count}</td></tr>`).join('')}</table><h2>Events</h2><pre>${esc(r.events.map(e=>`${e.created_at} [${e.level}] ${e.message}`).join('\n'))}</pre><h2>Artifacts</h2><ul>${r.artifacts.map(a=>`<li>${esc(a.relative_path)} · ${a.size_bytes} bytes · SHA256 ${esc(a.sha256)}</li>`).join('')}</ul>`}catch(e){app.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function create(){app.innerHTML='<h1>New Experiment</h1><div class="card"><p>Launch uses a checked-in TOML profile. Real datasets stay blocked until registered and provenance-complete.</p><div class="row"><input id="config" value="configs/experiments/smoke.toml" size="42"><select id="variant"><option>smoke_only</option><option>evaluation_corrected</option><option>released_code</option><option>research_variant</option></select><input id="seed" type="number" value="7"><button id="launch">Create and run</button></div><p id="msg" class="muted"></p></div>';launch.onclick=async()=>{msg.textContent='Creating…';try{const x=await api('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config_path:config.value,variant:variant.value,seed:Number(seed.value)})});msg.textContent='Queued '+x.run_id+'; starting worker…';const y=await api('/api/runs/'+x.run_id+'/start',{method:'POST'});msg.textContent='Finished with '+y.status}catch(e){msg.textContent=e.message;msg.className='error'}}}
async function datasets(){const ds=await api('/api/datasets');app.innerHTML=`<h1>Datasets & Environment</h1><div class="card"><p>Official data is never downloaded automatically. Registered inputs are fingerprinted local provenance.</p><p>Use <code>mhyper doctor</code> for CUDA, dependency and storage details.</p></div><h2>Registered datasets</h2>${ds.length?table(ds.map(d=>({run_id:d.name,name:d.version,dataset_name:d.name,variant:d.status,status:d.status,seed:'—',best_validation_mrr:'—'}))):'<div class="card">No datasets registered.</div>'}`}
async function compare(){app.innerHTML='<h1>Run Comparison</h1><div class="card"><p>Enter 2–8 run IDs. Compatibility warnings are computed from persisted provenance before numbers are compared.</p><div class="row"><input id="ids" size="70" placeholder="run_a,run_b"><button id="go">Compare</button></div><div id="comparison"></div></div>';go.onclick=async()=>{try{const x=await api('/api/compare?ids='+encodeURIComponent(ids.value));comparison.innerHTML=`<h2>Warnings</h2>${x.warnings.length?x.warnings.map(w=>`<p class="${w.severity==='blocks_direct_comparison'?'error':''}">${esc(w.severity)}: ${esc(w.reason)}</p>`).join(''):'<p>No compatibility warnings.</p>'}<h2>Runs</h2>${table(x.runs)}`}catch(e){comparison.innerHTML=`<p class="error">${esc(e.message)}</p>`}}}
function route(){const h=location.hash.slice(1);if(h.startsWith('run/'))detail(h.slice(4));else if(h==='runs')runs();else if(h==='compare')compare();else if(h==='new')create();else if(h==='datasets')datasets();else overview()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.page});window.onhashchange=route;route();
</script></body></html>
