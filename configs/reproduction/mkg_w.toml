# Proposed reproduction recipe based on the upstream README; not independently reproduced.
[run]
name = "mhyper-mkg-w-baseline"
kind = "reproduction"
variant = "evaluation_corrected"
seed = 42

[dataset]
name = "MKG-W"
registered_version = "local-v1"

[model]
name = "M_Hyper_B"
rank = 128

[training]
optimizer = "Adagrad"
learning_rate = 0.1
batch_size = 1000
max_epochs = 200
validation_interval_epochs = 5
regularizer = "wN3"
regularization_strength = 0.005

[evaluation]
checkpoint_selection = "best_validation_mrr"
ranking = "filtered"
missing_entity_sides = ["lhs", "rhs"]
report_hits_at = [1, 3, 10]
validation_source = "provided"

[execution]
device = "cuda:0"
store_per_query_ranks = false
